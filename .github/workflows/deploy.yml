name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  # A wedged deploy must never block later pushes: supersede it instead of queueing.
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      APP_DIR: ${{ vars.EC2_APP_DIR }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set defaults
        run: |
          echo "APP_DIR=${APP_DIR:-/opt/utthan}" >> "$GITHUB_ENV"
          echo "DB_NAME=${DB_NAME:-utthan}" >> "$GITHUB_ENV"
          echo "DB_USER=${DB_USER:-utthanuser}" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=${ADMIN_EMAIL:-admin@utthan.org}" >> "$GITHUB_ENV"
          echo "SITE_URL=${SITE_URL:-https://theutthanfoundation.in}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host utthan-ec2
            HostName ${EC2_HOST}
            User ${EC2_USER}
            IdentityFile ~/.ssh/ec2.pem
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          # Strip leading spaces that YAML indentation may leave in the heredoc body
          sed -i 's/^[[:space:]]*//' ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Ensure remote app directory
        run: |
          set -euo pipefail
          ssh utthan-ec2 "sudo mkdir -p '${APP_DIR}' && sudo chown \"\$(id -un):\$(id -gn)\" '${APP_DIR}'"

      - name: Sync application files
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.devcontainer/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.pem' \
            --exclude 'database/' \
            --exclude '.cursor/' \
            --exclude 'deploy/certbot/' \
            --exclude 'deploy/nginx/.ssl-enabled' \
            --exclude 'deploy/nginx/ssl/ssl-dhparams.pem' \
            ./ "utthan-ec2:${APP_DIR}/"

      - name: Write production .env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DB_PASSWORD}" || -z "${SESSION_SECRET}" || -z "${ADMIN_PASSWORD}" ]]; then
            echo "Missing required secrets: DB_PASSWORD, SESSION_SECRET, ADMIN_PASSWORD"
            exit 1
          fi
          {
            echo "PORT=3000"
            echo "ENV_MODE=production"
            echo "DB_DIALECT=postgres"
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_USER=${DB_USER}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "SESSION_SECRET=${SESSION_SECRET}"
            echo "ADMIN_EMAIL=${ADMIN_EMAIL}"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "SITE_URL=${SITE_URL}"
          } | ssh utthan-ec2 "cat > '${APP_DIR}/.env' && chmod 600 '${APP_DIR}/.env'"

      - name: Run bootstrap + deploy
        run: |
          set -euo pipefail
          ssh utthan-ec2 "APP_DIR='${APP_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${APP_DIR}"
          chmod +x deploy/*.sh
          ./deploy/bootstrap.sh

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
            COMPOSE=(docker compose)
          else
            DOCKER=(sudo docker)
            COMPOSE=(sudo docker compose)
          fi

          # Reclaim disk BEFORE building. A full root volume is what wedges this
          # deploy, and the old post-build "image prune -f" freed neither the
          # BuildKit cache nor unused tagged images. No --volumes: that would
          # delete postgres_data / uploads_data.
          echo "==> Disk before prune"
          df -h /
          "${DOCKER[@]}" system prune -af || true
          "${DOCKER[@]}" builder prune -af || true
          # Docker's own prune is not enough: `docker system df` does not count
          # container json log files, and apt/journal caches live outside Docker
          # entirely. Reclaim those too -- logs and caches only, never app data.
          echo "==> Reclaiming host disk"
          sudo apt-get clean || true
          sudo journalctl --vacuum-size=100M || true
          sudo find /var/log -type f \( -name '*.gz' -o -name '*.[0-9]' -o -name '*.old' \) \
            -delete || true
          # Truncate oversized container logs in place (the compose logging caps
          # only bound logs written from now on).
          sudo find /var/lib/docker/containers -name '*-json.log' -size +50M \
            -exec truncate -s 0 {} \; || true
          sudo truncate -s 0 /var/log/utthan-watchdog.log || true

          echo "==> Disk after prune"
          df -h /

          # Surface the real space consumers so this is diagnosable next time.
          echo "==> Largest host directories"
          sudo du -xhd1 / 2>/dev/null | sort -rh | head -12 || true
          echo "==> Largest /var directories"
          sudo du -xhd1 /var 2>/dev/null | sort -rh | head -8 || true

          # Threshold from the measured footprint: the app image is ~308MB, so
          # 1GB leaves >3x headroom for transient build layers and the base pull.
          AVAIL_MB="$(df -Pm / | awk 'NR==2 {print $4}')"
          if [[ "${AVAIL_MB}" -lt 1024 ]]; then
            echo "Only ${AVAIL_MB}MB free on / after prune; the build needs ~1GB."
            echo "Grow the EBS root volume or clear host data before retrying."
            "${DOCKER[@]}" system df || true
            exit 1
          fi

          "${COMPOSE[@]}" -p utthan pull db nginx || true
          # Bounded: compose blocks on depends_on health gates, so an unhealthy
          # app used to hang this step (and the whole deploy queue) indefinitely.
          if ! timeout 900 "${COMPOSE[@]}" -p utthan up -d --build --remove-orphans; then
            echo "compose up failed or timed out; continuing to health wait + logs"
            "${COMPOSE[@]}" -p utthan ps || true
            "${COMPOSE[@]}" -p utthan logs --tail=80 app || true
          fi

          # Keep HTTPS nginx config if SSL was previously enabled on this host.
          # Must not abort the deploy: it used to exit non-zero here under
          # `set -e`, skipping the health wait and the log dump below, which
          # left the site down with no diagnostics in the run output.
          if [[ -f deploy/nginx/.ssl-enabled ]]; then
            ./deploy/enable-ssl.sh --nginx-only || echo "WARNING: nginx SSL restore failed"
          fi

          echo "Waiting for health..."
          for i in $(seq 1 36); do
            if "${COMPOSE[@]}" -p utthan exec -T app curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 \
              || curl -fsS http://127.0.0.1/health >/dev/null 2>&1; then
              echo "Healthy"
              "${COMPOSE[@]}" -p utthan ps
              exit 0
            fi
            sleep 5
          done

          echo "Deploy did not become healthy in time"
          "${COMPOSE[@]}" -p utthan ps || true
          echo "==> app logs"
          "${COMPOSE[@]}" -p utthan logs --tail=120 app || true
          echo "==> nginx logs"
          "${COMPOSE[@]}" -p utthan logs --tail=60 nginx || true
          echo "==> db logs"
          "${COMPOSE[@]}" -p utthan logs --tail=30 db || true
          echo "==> Host resources"
          df -h /
          free -m
          exit 1
          REMOTE
