map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# See default.conf: a literal upstream makes nginx refuse to boot whenever the
# app container is down. Resolve via a variable so lookups happen per request.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name theutthanfoundation.in www.theutthanfoundation.in;

    set $upstream_app app:3000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://$upstream_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 301 https://theutthanfoundation.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.theutthanfoundation.in;

    ssl_certificate     /etc/letsencrypt/live/theutthanfoundation.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theutthanfoundation.in/privkey.pem;
    include /etc/nginx/ssl/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/ssl/ssl-dhparams.pem;

    return 301 https://theutthanfoundation.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name theutthanfoundation.in;

    ssl_certificate     /etc/letsencrypt/live/theutthanfoundation.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theutthanfoundation.in/privkey.pem;
    include /etc/nginx/ssl/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/ssl/ssl-dhparams.pem;

    client_max_body_size 25m;

    set $upstream_app app:3000;

    location /health {
        proxy_pass http://$upstream_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location / {
        # $request_uri is required with a variable upstream.
        proxy_pass http://$upstream_app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
