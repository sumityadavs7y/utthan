map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker's embedded DNS. With a literal `proxy_pass http://app:3000`, nginx
# resolves the upstream at config-load time and refuses to start with
# "host not found in upstream" whenever the app container is down -- taking
# the entire site offline with it. Resolving through a variable defers the
# lookup to request time, so nginx boots independently and serves 502s until
# the app returns (and it picks up a new container IP without a reload).
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP — ACME challenge + temporary site access before/during SSL setup.
server {
    listen 80;
    listen [::]:80;
    server_name theutthanfoundation.in www.theutthanfoundation.in _;

    client_max_body_size 25m;

    set $upstream_app app:3000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        proxy_pass http://$upstream_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        # $request_uri is required: with a variable upstream nginx no longer
        # forwards the original URI implicitly.
        proxy_pass http://$upstream_app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
